<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sajeeva Vahini Bible</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#fff}
.topbar{height:60px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#7a1010;color:#fff;position:fixed;top:0;left:0;right:0;z-index:99999;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.back{border:0;background:#fff;color:#7a1010;font-weight:700;border-radius:9px;padding:10px 16px;font-size:16px;cursor:pointer}
.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{position:fixed;top:60px;left:0;width:100%;height:calc(100% - 60px);border:0;background:#fff}
.external{position:fixed;right:12px;bottom:12px;z-index:99999;background:#7a1010;color:#fff;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
</style>
</head>
<body>
<header class="topbar">
<button class="back" type="button" onclick="goBack()">← Back</button>
<div class="title" id="title">Sajeeva Vahini Bible</div>
</header>
<iframe id="bibleFrame" class="frame" title="Sajeeva Vahini Bible"></iframe>
<a id="external" class="external" target="_blank" rel="noopener">Open Website ↗</a>
<script>
const p=new URLSearchParams(location.search);
const url=p.get('url');
const ref=p.get('ref')||'Sajeeva Vahini Bible';
document.getElementById('title').textContent=ref;
document.getElementById('bibleFrame').src=url||'about:blank';
document.getElementById('external').href=url||'index.html';
function goBack(){history.back()}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Channels Folder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="homeView" class="view active">
      <div class="hero">
        <div class="folder-card" id="openFolder" role="button" tabindex="0">
          <div class="folder-icon">📁</div>
          <h1>పాషండ మతాలను చీల్చి చెండాడుతున్న స్వప్న సింహాలు 🦁🔥</h1>
          <p>20 YouTube Channels</p>
          <button>Open Folder →</button>
        </div>
      </div>
    </section>

    <section id="listView" class="view">
      <header class="topbar">
        <button id="backBtn" class="back-btn">← Back</button>
        <div>
          <h2>📁 పాషండ మతాలను చీల్చి చెండాడుతున్న స్వప్న సింహాలు</h2>
          <span>20 YouTube Channels</span>
        </div>
      </header>
      <div id="channelList" class="channel-list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
